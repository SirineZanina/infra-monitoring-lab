global:
  # The Slack incoming-webhook URL is read from a file kept out of Git (see secrets/README.md).
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="info"]
      receiver: "null"          # info alerts stay visible in Prometheus/Grafana only

receivers:
  - name: slack
    slack_configs:
      - channel: "#infra-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Severity: {{ .Labels.severity }} | Instance: {{ .Labels.instance }}
          {{ end }}
  - name: "null"

inhibit_rules:
  # If a target is completely down, don't also page for its interfaces.
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [alertname="InterfaceDown"]
    equal: [instance]
