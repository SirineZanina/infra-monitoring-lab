! SNMPv3 (authPriv) for Cisco IOS routers in the GNS3 lab.
! Paste in configuration mode on each router you want to monitor (e.g. PE1 and PE2 of the MPLS lab).
! Use the same passwords as in snmp_exporter/snmp.yml.
!
! 1. Management interface towards the Docker host
!    (connect the router to a GNS3 "Cloud" node bound to virbr0, network 192.168.122.0/24)
interface FastEthernet1/0
 description MGMT to monitoring host
 ip address 192.168.122.11 255.255.255.0
 no shutdown
!
! 2. Read-only SNMPv3 view, group and user
snmp-server view LAB-RO iso included
snmp-server group MONITOR v3 priv read LAB-RO access SNMP-MGMT
snmp-server user monitor MONITOR v3 auth sha CHANGE_ME_AUTH_PASSWORD priv aes 128 CHANGE_ME_PRIV_PASSWORD
!
! 3. Only the monitoring host may query SNMP
ip access-list standard SNMP-MGMT
 permit host 192.168.122.1
 deny   any log
!
! 4. Keep interface indexes stable across reloads, so Grafana history stays consistent
snmp-server ifindex persist
!
end
! Verify from the Docker host:
!   snmpwalk -v3 -l authPriv -u monitor -a SHA -A <auth> -x AES -X <priv> 192.168.122.11 1.3.6.1.2.1.2.2.1.8
